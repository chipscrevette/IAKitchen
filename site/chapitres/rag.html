<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La tarte de la maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../moteur/moteur.css">
<style>
  /* « Chercher » : les bocaux sont serrés (vraies positions de l'ACP) : le score passe à droite du bocal, l'étiquette reste sur une ligne */
  .o.cote .score { left: 100%; bottom: 50%; transform: translate(-18px, 50%); }
  .o.cote .etiq { white-space: nowrap; max-width: none; }
</style>
</head>
<body>
<script src="../donnees/catalogue.js"></script>
<script src="../donnees/tailles.js"></script>
<script src="../donnees/embeddings-e5.js"></script>
<script src="../moteur/moteur.js"></script>
<script>
// Chapitre RAG · la tarte de la maison.
// Le savoir = les préparations de la maison, mises en bocaux (passages) ; le commis = le modèle d'embedding ; le chef = le LLM.
const { objet, element, poser, poserBase, solPlateau, image, placer, fr } = Cuisine;
Cuisine.construire({ notion: 'RAG', titre: 'La tarte de la maison' });

const NOMS = ['Pâte sablée', 'Crème d’amande', 'Poires pochées', 'Fond brun', 'Vinaigrette', 'Velouté potiron', 'Beurre blanc', 'Coulis framboise'];
objet('plateau', 'plateau', 600);
objet('cocotte', 'cocotte', 250); objet('saladier', 'saladier', 220); objet('marmite', 'marmite', 200); objet('pichet', 'pichet', 160);
const BOCAUX = ['bocal-pate-sablee', 'bocal-creme-amande', 'bocal-poires-pochees', 'bocal-fond-brun', 'bocal-vinaigrette', 'bocal-veloute-potiron', 'bocal-beurre-blanc', 'bocal-coulis-framboise'];
NOMS.forEach((t, i) => { const b = objet('bo' + i, BOCAUX[i], 112, `<span class="etiq">${t}</span><span class="score cache"></span>`); b.querySelector('.etiq').style.setProperty('--r', [-2, 1.5, -1, 2, -1.5, 1, -2.5, 1.8][i] + 'deg'); });
objet('commis', 'commis-goute', 180);
objet('chef', 'chef-attend', 160);
objet('serveur', 'serveur-ticket', 180);
objet('ticket', 'ticket', 260, `<div class="sur-ticket">Table 4 :<br>la tarte de la maison, celle de la grand-mère du patron.</div>`);
objet('tarte', 'tarte', 220);
objet('tartePommes', 'tarte-pommes', 210);
const fiche = element('fiche');

// l'étagère du marbre : rangées = ordre vertical de la vraie projection (ACP des 384 nombres), colonnes = ordre horizontal
const XY = EMB.fiches.map(f => f.xy).concat([EMB.question.xy]);
const bx = [Math.min(...XY.map(p => p[0])), Math.max(...XY.map(p => p[0]))], by = [Math.min(...XY.map(p => p[1])), Math.max(...XY.map(p => p[1]))];
const PROJ = EMB.fiches.map(f => [(f.xy[0] - bx[0]) / (bx[1] - bx[0]), (f.xy[1] - by[0]) / (by[1] - by[0])]), POS_BOCAL = [];
const parY = PROJ.map((p, i) => i).sort((a, b) => PROJ[a][1] - PROJ[b][1]);
[parY.slice(0, 3), parY.slice(3, 6), parY.slice(6)].forEach((rang, r) => {
  const cols = rang.length === 3 ? [1420, 1595, 1770] : [1507, 1682];
  rang.sort((a, b) => PROJ[a][0] - PROJ[b][0]).forEach((i, c) => POS_BOCAL[i] = [cols[c], 300 + r * 200]);
});
const TOP3 = EMB.fiches.map((f, i) => i).sort((a, b) => EMB.fiches[b].score - EMB.fiches[a].score).slice(0, 3);

// le profil de goût : 6 notes nommées sur 10 (l'image de cuisine ; le vrai calcul a 384 notes sans nom)
const AXES = ['Sucré', 'Fruité', 'Beurré', 'Grillé', 'Acide', 'Salé'];
const PROFILS = [[6, 0, 9, 6, 0, 2], [8, 1, 7, 5, 0, 0], [8, 9, 2, 1, 3, 0], [1, 0, 1, 8, 1, 9], [0, 1, 0, 1, 9, 6], [2, 1, 5, 0, 1, 7], [0, 1, 9, 0, 6, 5], [5, 9, 0, 0, 8, 0]];
const PROFIL_TICKET = [8, 8, 6, 4, 2, 1];
function radar(p, { taille = 250, trace = null, titre = '' } = {}) {
  const W = taille + 96, H = taille + 16 + (titre ? 34 : 0), cx = W / 2, cy = taille / 2 + 10, R = taille * .38;
  const pt = (i, v) => { const a = i / 6 * Math.PI * 2 - Math.PI / 2, r = R * v / 10; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const poly = v => v.map((x, i) => pt(i, x).map(n => n.toFixed(1)).join(',')).join(' ');
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="flex:none;display:block">`;
  s += `<polygon points="${poly(Array(6).fill(10))}" fill="#F6EFE2"/>`;
  [10, 6.67, 3.33].forEach(n => s += `<polygon points="${poly(Array(6).fill(n))}" fill="none" stroke="#E0D3BC" stroke-width="1.2"/>`);
  AXES.forEach((a, i) => {
    const [x, y] = pt(i, 10), [lx, ly] = pt(i, 12.5);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E0D3BC" stroke-width="1.2"/>`;
    s += `<text x="${lx}" y="${ly + 6}" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="600" font-size="18" fill="#5E574F">${a}</text>`;
  });
  s += `<polygon points="${poly(p)}" fill="rgba(216,67,43,.28)" stroke="#D8432B" stroke-width="3" stroke-linejoin="round"/>`;
  p.forEach((v, i) => { const [x, y] = pt(i, v); s += `<circle cx="${x}" cy="${y}" r="4" fill="#D8432B"/>`; });
  if (trace) s += `<polygon points="${poly(trace)}" fill="none" stroke="#2A2A2E" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round"/>`;
  if (titre) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-family="Kalam" font-weight="700" font-size="22" fill="#2A2A2E">${titre}</text>`;
  return s + '</svg>';
}
function montrerFiche(mode) {
  if (!mode) return placer(fiche, 1350, 170, false);
  if (mode === 'bocal') { placer(fiche, 1350, 170, true, 2); fiche.innerHTML = `<p class="k">Fiche de dégustation</p><p class="t">Crème d’amande</p>${radar(PROFILS[1])}`; }
  if (mode === 'ticket') { placer(fiche, 560, 190, true, -2); fiche.innerHTML = `<p class="k">Le goût imaginé</p><p class="t">La tarte de la maison</p>${radar(PROFIL_TICKET)}`; }
  if (mode === 'compare') { placer(fiche, 470, 470, true, -1); fiche.innerHTML = `<p class="k">Les 3 plus proches</p>
    <div class="leg"><span><i style="border-top:3px dashed #2A2A2E"></i>le goût imaginé</span><span><i style="border-top:4px solid #D8432B"></i>le bocal</span></div>
    <div class="rangee">${TOP3.map(i => radar(PROFILS[i], { taille: 112, trace: PROFIL_TICKET, titre: NOMS[i] })).join('')}</div>`; }
}

const ETAPES = [
  { nom: 'La commande', t: 'Le serveur accroche une commande.', lignes: [{ qui: 'serveur', dit: '« La tarte de la maison, celle de la grand-mère du patron. »' }], v: 'c’est la question posée à l’IA.' },
  { nom: 'Sans RAG', t: 'Le chef n’a jamais vu cette recette.', lignes: [{ qui: 'chef', dit: '« Une tarte de grand-mère ? Facile : tarte aux pommes ! »', tampon: 'RATÉ' }], v: 'une IA seule invente quand la réponse est dans TES documents, qu’elle n’a jamais lus.' },
  { nom: 'Mettre en bocaux', t: 'Le commis remplit des bocaux à la louche, dans les grandes préparations de la maison : une par bocal, étiquetée.', v: 'on découpe les documents en petits passages.' },
  { nom: 'Goûter', t: 'Il goûte chaque bocal et note son profil : sucré, fruité, beurré, grillé, acide, salé.', lignes: [{ qui: 'commis', dit: '« Celui-ci : sucré, beurré, un peu fruité. »' }], v: 'c’est l’embedding. Le modèle donne à chaque passage une liste de 384 notes sans nom, qu’il a apprises seul. Deux passages proches ont des listes proches.' },
  { nom: 'Ranger', t: 'Il range le garde-manger.', lignes: [{ qui: 'commis', dit: '« Les goûts proches, je les mets côte à côte. »' }], v: 'c’est la base de vecteurs. L’ordre des bocaux sur le marbre vient des vrais calculs, aplatis sur la table.' },
  { nom: 'Imaginer', t: 'Il lit la commande et imagine le goût du plat demandé.', lignes: [{ qui: 'commis', dit: '« Une tarte de grand-mère… du sucré, du beurré, un peu de fruit. »' }], v: 'la question reçoit ses notes, par le même modèle que les passages.' },
  { nom: 'Chercher', t: 'Il compare chaque bocal au goût imaginé.', lignes: [{ qui: 'commis', dit: '« Ces trois-là collent le mieux ! »' }], v: 'c’est la recherche par similarité. Les notes au-dessus des bocaux sont les vraies (le cosinus).' },
  { nom: 'Le plateau', t: 'Il pose les 3 bocaux sur un plateau, à côté du chef.', lignes: [{ qui: 'chef', dit: '« Merci. Avec ça, je sais quoi faire. »' }], v: 'on ajoute ces passages à la question. Le plateau a une taille limitée, comme la mémoire de travail de l’IA.' },
  { nom: 'Servir', t: 'Le chef cuisine avec les bonnes préparations sous la main.', lignes: [{ qui: 'chef', dit: '« Voici la tarte de la maison : pâte sablée, crème d’amande, poires pochées au vin. »', tampon: { txt: 'JUSTE', vert: true } }], v: 'le modèle répond à partir des passages retrouvés, et peut les citer.' },
];

function monde(kk, k) {
  // le poste de cuisson : hors champ pendant le travail au garde-manger (étapes 4 à 6), la caméra suit le commis
  const cuisson = kk < 4 || kk > 6;
  poser('cocotte', 50, 250, 1, cuisson); poser('saladier', 40, 490, 1, cuisson); poser('marmite', 300, 240, 1, cuisson); poser('pichet', 305, 505, 1, cuisson);
  poser('ticket', 1060, k < 0 ? -260 : 26, 1, kk <= 1);
  NOMS.forEach((n, i) => {
    const grille = [522 + (i % 4) * 156, 250 + Math.floor(i / 4) * 180];
    const j = TOP3.indexOf(i), [mx, my] = POS_BOCAL[i];
    if (kk < 2) poser('bo' + i, 260, 420, .4, false);
    else if (kk <= 3) poser('bo' + i, grille[0], grille[1], 1, true, kk === 2 ? .09 * i : 0);
    else if (kk >= 7 && j >= 0) { const sol = solPlateau(470, 470, 600); poserBase('bo' + i, 'bocal', 112, sol.x0 + (sol.x1 - sol.x0) * [.14, .5, .86][j], sol.y0 + (sol.y1 - sol.y0) * .56, 1, true, .15 * j); }
    else poser('bo' + i, mx - 56, my - 70, 1, true, kk === 4 ? .07 * i : 0);
    const sc = Cuisine.O['bo' + i].querySelector('.score');
    sc.innerHTML = (j >= 0 ? `<b>n° ${j + 1}</b>` : '') + fr(EMB.fiches[i].score, 3);
    sc.classList.toggle('cache', kk !== 6 || j < 0); sc.classList.toggle('top', j >= 0);
    Cuisine.O['bo' + i].classList.toggle('choisi', (kk === 6 && j >= 0) || (kk === 3 && i === 1));
    Cuisine.O['bo' + i].classList.toggle('terne', kk === 6 && j < 0);
    Cuisine.O['bo' + i].classList.toggle('sans-etiq', kk === 6 && j < 0);   // seuls les 3 retenus gardent leur étiquette et leur score
    Cuisine.O['bo' + i].classList.toggle('cote', kk === 6);
  });
  image('commis', { 2: 'commis-remplit', 3: 'commis-goute', 4: 'commis-range', 5: 'commis-imagine', 6: 'commis-range' }[kk] || 'commis-goute', 330);
  poser('commis', kk === 4 ? 1080 : kk === 6 ? 1175 : kk === 5 ? 1030 : 1125, 230, 1, kk >= 2 && kk <= 6);
  image('chef', kk === 1 ? 'chef-improvise' : kk === 8 ? 'chef-cuisine' : 'chef-attend', 370);
  poser('chef', kk === 0 ? 930 : kk === 1 ? 960 : 1090, 430, 1, kk <= 1 || kk >= 7);
  Cuisine.perso('serveur', 'serveur-ticket', 1290, 800, kk === 0);
  poser('plateau', 470, 470, 1, kk >= 7);
  poser('tarte', 1330, 560, .95, kk === 8);
  poser('tartePommes', 690, 600, 1, kk === 1);
  montrerFiche(kk === 3 ? 'bocal' : kk === 5 ? 'ticket' : kk === 6 ? 'compare' : null);
}

Cuisine.lancer({
  id: 'rag', notion: 'RAG', titre: 'La tarte de la maison',
  chapeau: 'Comment une IA va chercher la réponse dans TES documents, au lieu de l’inventer.',
  etapes: ETAPES, monde,
  suivant: { href: 'mise-en-place.html', titre: 'Chapitre suivant : la mise en place' },
  recap: {
    titre: 'Le RAG, c’est une cuisine bien rangée',
    trois: [
      { img: 'commis-range', t: 'R · Retrouver', d: 'Le commis va chercher les bocaux dont le goût colle à la commande.' },
      { img: 'plateau', t: 'A · Augmenter', d: 'Il les pose sur le plateau, avec le ticket : la question arrive avec ses sources.' },
      { img: 'chef-cuisine', t: 'G · Générer', d: 'Le chef cuisine avec les bonnes préparations, au lieu d’inventer.' },
    ],
    entretien: '« Le RAG donne au modèle les bons passages de nos documents au moment de répondre. On découpe les documents, on les transforme en vecteurs, on cherche les plus proches de la question et on les ajoute au prompt. Moins d’inventions, et sans réentraîner le modèle. »',
    source: 'Source : <a href="https://arxiv.org/abs/2005.11401" target="_blank" rel="noopener">Lewis et al., 2020</a> · vrais embeddings : multilingual-e5-small',
  },
});
</script>
</body>
</html>
