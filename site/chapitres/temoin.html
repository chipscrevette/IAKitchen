<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deux salles, une seule change</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../moteur/moteur.css">
<style>
  .fiche .cas { margin: 12px 0 0; padding: 12px 14px; background: var(--creme); border-radius: 12px; }
  .fiche .cas b { display: block; font: 800 var(--ws)/1.2 'Bricolage Grotesque'; }
  .fiche .cas span { display: block; font: 800 var(--wm)/1.1 'Bricolage Grotesque'; margin-top: 6px; }
  .fiche .cas span.s { color: var(--sarcelle); } .fiche .cas span.t { color: var(--tomate); }
  .fiche .cas i { display: block; font: 700 var(--ws)/1.3 'Kalam', cursive; font-style: normal; margin-top: 4px; color: var(--encre-2); }
</style>
</head>
<body>
<script src="../donnees/catalogue.js"></script>
<script src="../donnees/tailles.js"></script>
<script src="../moteur/moteur.js"></script>
<script>
// Chapitre Groupe témoin · deux salles, une seule change (storyboard, chapitre 22).
// Chiffres réels (fiche finale) : Peng et al., 2023 (arXiv 2302.06590) : avec GitHub Copilot, le groupe traité finit la tâche 55,8 % plus vite
// que le groupe témoin ; METR, 2025 : 16 développeurs expérimentés, 19 % plus lents avec l'IA, alors qu'ils se croyaient 20 % plus rapides.
// Les chiffres de la salle (120 desserts, +20 %…) sont ceux de l'histoire, pas des données.
const { objet, element, poser, poserSur, perso, placer, O } = Cuisine;
Cuisine.construire({ notion: 'Groupe témoin', titre: 'Deux salles, une seule change' });
const larg = (src, vis) => vis / (BOITES[src][1] - BOITES[src][0]);

objet('ardoiseA', 'ardoise', larg('ardoise', 340), '<div class="craie"></div>');
objet('ardoiseB', 'ardoise', larg('ardoise', 340), '<div class="craie"></div>');
objet('tarte', 'tarte-pommes', larg('tarte-pommes', 150), '<span class="etiq">l’ancien dessert</span>');
objet('gateau', 'gateau', larg('gateau', 170), '<span class="etiq">le nouveau dessert</span>');
objet('patronne', 'patronne-lit', 160);
objet('serveur', 'serveur-attend', 180);
const fiche = element('fiche');
const craie = (id, html) => O[id].querySelector('.craie').innerHTML = html;

const ETAPES = [
  { nom: 'Le nouveau menu', t: 'La patronne a mis un nouveau dessert à la carte. Samedi : 120 desserts vendus, 20 % de plus que d’habitude.', lignes: [{ qui: 'patronne', dit: '« Le nouveau menu marche ! »' }], v: 'on installe un outil d’IA, les chiffres montent… et on conclut que c’est grâce à lui.' },
  { nom: 'Mais…', lignes: [{ qui: 'serveur', dit: '« Samedi, il y avait le match au bar d’en face… »' }, { dit: 'La salle était pleine.' }], v: 'd’autres choses changent en même temps : saison, équipe, clients. Sans comparaison, impossible de savoir ce qui a joué.' },
  { nom: 'Deux salles', t: 'Samedi suivant : deux salles, même soir.', lignes: [{ qui: 'patronne', dit: '« Salle A, l’ancien dessert. Salle B, le nouveau. Les clients, au hasard ! »' }], v: 'c’est un groupe témoin : on compare deux groupes tirés au hasard, identiques sauf sur un seul point.' },
  { nom: 'Le vrai gain', t: 'Salle A : 50 desserts. Salle B : 56.', lignes: [{ qui: 'serveur', dit: '« Plus 12 %. Le reste, c’était le match. »' }], v: 'seul l’écart entre les deux groupes mesure l’effet de l’outil. Le reste, c’était le match.' },
  { nom: 'Pour de vrai', t: 'Avec des groupes témoins, on a mesuré l’effet réel des assistants de code. Et le ressenti peut tromper.', v: 'avec GitHub Copilot, des développeurs ont fini 55,8 % plus vite que le groupe témoin. Mais chez METR (2025), des développeurs expérimentés ont été 19 % plus lents avec l’IA… en se croyant 20 % plus rapides.' },
];

function monde(kk, k) {
  const deux = kk >= 2;
  // le samedi du match : une seule ardoise, celle du nouveau dessert ; elle devient la salle B quand la salle A s'installe à côté
  poserSur('ardoiseB', deux ? 1050 : 900, 470);
  poserSur('gateau', deux ? 1050 : 900, 650);
  poserSur('ardoiseA', 600, 470, 1, deux);
  poserSur('tarte', 600, 650, 1, deux);
  O.gateau.classList.toggle('sans-etiq', !deux); O.tarte.classList.toggle('sans-etiq', !deux);
  if (!deux) craie('ardoiseB', '<b>Samedi</b><span class="n">+20 %</span>120 desserts');
  else {
    craie('ardoiseA', `<b>Salle A</b>ancien dessert${kk >= 3 ? '<span class="n">50</span>' : ''}`);
    craie('ardoiseB', `<b>Salle B</b>nouveau dessert${kk >= 3 ? '<span class="n">56</span>' : ''}`);
  }
  O.ardoiseB.classList.toggle('choisi', kk === 3);
  perso('patronne', kk === 0 ? 'patronne-signe' : 'patronne-lit', 280, 720);
  perso('serveur', 'serveur-attend', 1420, 720, kk >= 1 && kk <= 3);
  if (kk === 4) {
    fiche.style.width = '520px';
    fiche.innerHTML = '<p class="k">Deux vraies études, avec groupe témoin</p>' +
      '<div class="cas"><b>GitHub Copilot · Peng et al., 2023</b><span class="s">55,8 % plus rapides</span><i>que le groupe témoin, pour coder un serveur web</i></div>' +
      '<div class="cas"><b>METR, 2025 · 16 développeurs expérimentés</b><span class="t">19 % plus lents</span><i>avec l’IA, alors qu’ils se croyaient 20 % plus rapides</i></div>';
    placer(fiche, 1300, 110, true, 1);
  } else placer(fiche, 1300, 110, false);
}

Cuisine.lancer({
  id: 'temoin', notion: 'Groupe témoin', titre: 'Deux salles, une seule change',
  chapeau: 'Comment savoir si un gain vient vraiment de l’IA, et pas d’autre chose.',
  etapes: ETAPES, monde, duree: '1 minute',
  suivant: { href: 'addition.html', titre: 'Chapitre suivant : l’addition' },
  recap: {
    titre: 'Le groupe témoin, c’est la deuxième salle',
    trois: [
      { img: 'ardoise', t: 'Deux groupes', d: 'Tirés au hasard, identiques sauf l’outil testé.' },
      { img: 'gateau', t: 'L’écart', d: 'Seule la différence entre les groupes mesure l’effet.' },
      { img: 'patronne-lit', t: 'Pas le ressenti', d: 'On croit souvent aller plus vite : on mesure.' },
    ],
    entretien: '« Pour mesurer l’effet d’un outil d’IA, on compare à un groupe témoin : deux groupes tirés au hasard, dont un seul utilise l’outil. Sinon, on confond l’effet de l’IA avec d’autres changements. Le ressenti trompe : chez METR, des développeurs se croyaient 20 % plus rapides avec l’IA et étaient en réalité 19 % plus lents ; à l’inverse, un essai contrôlé sur Copilot a mesuré 55,8 % de gain. »',
    source: 'Sources : <a href="https://arxiv.org/abs/2302.06590" target="_blank" rel="noopener">Peng et al., 2023</a> · <a href="https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/" target="_blank" rel="noopener">METR, 2025</a>',
  },
});
</script>
</body>
</html>
