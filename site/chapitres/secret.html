<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La recette secrète</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../moteur/moteur.css">
<style>
  .fiche .ligne { margin: 8px 0 0; font: 600 var(--ws)/1.35 'Bricolage Grotesque'; color: var(--encre-2); }
  .fiche .ligne b { color: var(--encre); }
  .fiche .gros { display: block; font: 800 var(--wm)/1.15 'Bricolage Grotesque'; color: var(--tomate); margin-top: 10px; }
</style>
</head>
<body>
<script src="../donnees/catalogue.js"></script>
<script src="../donnees/tailles.js"></script>
<script src="../moteur/moteur.js"></script>
<script>
// Chapitre Données confidentielles · la recette secrète (storyboard, chapitre 25).
// Cas réel : Samsung, 2023 : des ingénieurs collent du code source interne et des notes de réunion dans ChatGPT ;
// l'entreprise restreint ensuite l'usage des IA génératives. Offres entreprise (ChatGPT Enterprise, API…) : les données ne servent pas
// à entraîner les modèles par défaut ; dans les offres grand public, les conversations peuvent servir à l'entraînement sauf si on le désactive.
const { objet, element, poser, poserSur, perso, placer, O } = Cuisine;
Cuisine.construire({ notion: 'Données confidentielles', titre: 'La recette secrète' });
const larg = (src, vis) => vis / (BOITES[src][1] - BOITES[src][0]);

objet('coffre', 'coffre', larg('coffre', 200), '<span class="etiq">le coffre</span>');
objet('carnet', 'carnet-secret', larg('carnet-secret', 130), '<span class="etiq">la recette secrète</span>');
objet('copie', 'carnet', larg('carnet', 130), '<span class="etiq">chez le prestataire</span>');
objet('commis', 'commis-telephone', 180);
objet('patronne', 'patronne-lit', 160);
objet('chef', 'chef-attend', 160);
const fiche = element('fiche'), contrat = element('bon');
contrat.innerHTML = '<p class="k">Contrat</p><p>Vos recettes restent à vous : elles ne servent à rien d’autre.</p><span class="tampon oui">SIGNÉ</span>';

const ETAPES = [
  { nom: 'La recette secrète', t: 'La recette secrète de la maison est gardée près du coffre. Seuls la patronne et le chef la connaissent.', lignes: [{ qui: 'patronne', dit: '« Cette recette ne quitte pas la maison. »' }], v: 'une entreprise a ses données confidentielles : contrats, code source, données clients, stratégie.' },
  { nom: 'Un coup de fil', t: 'Pressé, le commis appelle un service de traduction.', lignes: [{ qui: 'commis', dit: '« Alors : 200 g de beurre, et le secret, c’est… »' }], v: 'coller un document dans une IA en ligne, c’est l’envoyer à un prestataire, hors de l’entreprise.' },
  { nom: 'Où part-elle ?', lignes: [{ qui: 'commis', dit: '« … Vous avez tout noté ? Parfait, merci ! »' }, { dit: 'À l’autre bout du fil, quelqu’un a tout noté. La recette existe maintenant hors de la cuisine.' }], v: 'selon l’offre, le texte est conservé chez le fournisseur ; dans les offres grand public, il peut servir à entraîner les modèles, sauf si on le désactive.' },
  { nom: 'Pour de vrai', t: 'C’est arrivé chez Samsung en 2023.', v: 'des ingénieurs ont collé du code source interne et des notes de réunion dans ChatGPT. L’entreprise a ensuite restreint l’usage des IA génératives en interne.' },
  { nom: 'Les règles', t: 'La patronne fixe les règles.', lignes: [{ qui: 'patronne', dit: '« Un prestataire sous contrat, ou on cuisine à la maison. »' }, { dit: 'Et la recette retourne au coffre.' }], v: 'offres entreprise (données non utilisées pour l’entraînement par défaut, contrat), modèle hébergé chez soi, anonymisation, et des règles claires pour les équipes.' },
];

function monde(kk, k) {
  const fuite = kk >= 1 && kk <= 3;
  poserSur('coffre', 420, 700);
  poserSur('carnet', fuite ? 830 : 640, 700);
  O.carnet.classList.toggle('choisi', kk === 1);
  poserSur('copie', 1480, 700, 1, kk === 2 || kk === 3);
  O.copie.classList.toggle('choisi', kk === 2);
  perso('commis', 'commis-telephone', 1020, 720, kk === 1 || kk === 2);
  perso('patronne', kk === 4 ? 'patronne-signe' : kk === 3 ? 'patronne-refuse' : 'patronne-lit', kk >= 3 ? 1020 : 200, 720);
  perso('chef', 'chef-attend', 870, 720, kk === 0);
  placer(contrat, 1200, 380, kk === 4, 2);
  if (kk === 2) { fiche.style.width = '400px'; fiche.innerHTML = '<p class="k">À l’autre bout du fil</p><p class="ligne">La recette est <b>notée chez le prestataire</b>.</p><p class="ligne">Dans une offre grand public, elle peut <b>servir à entraîner</b> le modèle, sauf si on le désactive.</p>'; placer(fiche, 1340, 100, true, 1.5); }
  else if (kk === 3) { fiche.style.width = '400px'; fiche.innerHTML = '<p class="k">Samsung · 2023</p><span class="gros">Du code source interne collé dans ChatGPT</span><p class="ligne">L’entreprise restreint ensuite l’usage des IA génératives.</p>'; placer(fiche, 1340, 100, true, 1.5); }
  else if (kk === 4) { fiche.style.width = '460px'; fiche.innerHTML = '<p class="k">Les règles de la maison</p><div class="deux-col"><div><b class="oui">Oui</b><ul><li>offre sous contrat</li><li>modèle chez soi</li><li>anonymiser</li></ul></div><div><b class="non">Non</b><ul><li>un secret dans une IA grand public</li></ul></div></div>'; placer(fiche, 1340, 100, true, 1.5); }
  else placer(fiche, 1340, 100, false);
}

Cuisine.lancer({
  id: 'donnees', notion: 'Données confidentielles', titre: 'La recette secrète',
  chapeau: 'Où partent les données qu’on colle dans une IA, et comment protéger ce qui est confidentiel.',
  etapes: ETAPES, monde, duree: '1 minute',
  suivant: { href: '../index.html', titre: 'Retour à la carte' },
  recap: {
    titre: 'Les données confidentielles, c’est la recette secrète',
    trois: [
      { img: 'telephone', t: 'Ça sort', d: 'Ce qu’on colle dans une IA en ligne part chez un prestataire.' },
      { img: 'carnet-secret', t: 'Ça peut rester', d: 'Conservé, parfois utilisé pour entraîner selon l’offre.' },
      { img: 'coffre', t: 'On protège', d: 'Offre entreprise, modèle chez soi, anonymisation, règles claires.' },
    ],
    entretien: '« Envoyer un texte à une IA en ligne, c’est le confier à un prestataire. Dans les offres grand public, il peut être conservé et servir à l’entraînement ; dans les offres entreprise et via l’API, il ne l’est pas par défaut. Pour des données sensibles, on passe par une offre sous contrat, un modèle hébergé en interne, ou on anonymise, et on fixe des règles claires : l’exemple de Samsung en 2023 montre ce qui arrive sinon. »',
    source: 'Sources : <a href="https://www.bloomberg.com/news/articles/2023-05-02/samsung-bans-chatgpt-and-other-generative-ai-use-by-staff-after-leak" target="_blank" rel="noopener">Bloomberg, mai 2023</a> · <a href="https://openai.com/enterprise-privacy/" target="_blank" rel="noopener">OpenAI, Enterprise privacy</a>',
  },
});
</script>
</body>
</html>
