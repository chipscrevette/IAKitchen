<!doctype html>
<meta charset="utf-8">
<title>Dump des lignes</title>
<!-- Outil : ouvre chaque chapitre dans un cadre, parcourt ses étapes et écrit toutes ses lignes (récit, répliques, En vrai) en JSON
     dans #sortie. Usage : chrome --headless --dump-dom http://localhost:4740/outils/controle/dump-lignes.html?c=rag,token -->
<pre id="sortie">…</pre>
<script>
const CHAP = (new URLSearchParams(location.search).get('c') || 'motsuivant,token,temperature,entrainement,hallucination,finetuning,contexte,lost,embeddings,rag,mise-en-place,outil,rag-ou-outil,mcp,outils,agent,workflow,memoire,brigade,humain,evaluation,temoin,addition,injection,secret').split(',');
const attendre = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  const tout = {};
  for (const c of CHAP) {
    const f = document.createElement('iframe'); f.style.cssText = 'width:1280px;height:720px;border:0';
    f.src = '../../site/chapitres/' + c + '.html#0'; document.body.appendChild(f);
    await new Promise(r => f.onload = r); await attendre(300);
    const C = f.contentWindow.Cuisine, n = f.contentDocument.querySelectorAll('#dock .prog button').length - 1, etapes = [];
    for (let k = 0; k < n; k++) { C.aller(k); await attendre(20); etapes.push(C.lignes); }
    tout[c] = etapes; f.remove();
  }
  document.getElementById('sortie').textContent = JSON.stringify(tout);
})();
</script>
